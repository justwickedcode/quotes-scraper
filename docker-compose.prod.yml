# Production deployment of the crawler on its own, deployed against Postgres and Redis that
# already exist as their own Dokploy Database resources (managed and backed up outside this
# file) — no postgres/redis service blocks here. docker-compose.yml next to this file is the
# local-dev Postgres/Redis only. See PRODUCTION.md.
#
# Required env vars:
#   DATABASE_URL — the shared quotes Postgres database's connection string
#   REDIS_ADDR   — the crawler's own Redis connection string (redis://... is fine directly)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  crawler:
    build: .
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_DB: 0
      GOMEMLIMIT: 1536MiB
      LOG_LEVEL: error
    deploy:
      resources:
        limits:
          memory: 2G

# Dokploy Database resources live on the shared "dokploy-network" overlay network — a Compose
# project's auto-created default bridge network has no route to them, and DATABASE_URL/REDIS_ADDR
# hostnames fail DNS resolution outright. See PRODUCTION.md's findings.
networks:
  default:
    name: dokploy-network
    external: true
