# Production deployment of the crawler: the crawler itself plus its own private Redis. Postgres is
# NOT run here — it's the shared quotes database that already exists as a Dokploy Database
# resource (managed and backed up outside this file), reached via DATABASE_URL.
# docker-compose.dev.yml next to this file is the local-dev Postgres/Redis only. See PRODUCTION.md.
#
# Required env vars:
#   DATABASE_URL — the shared quotes Postgres database's connection string

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  crawler:
    build: .
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      crawler-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: crawler-redis:6379
      REDIS_DB: 0
      GOMEMLIMIT: 1536MiB
      LOG_LEVEL: error
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - internal
      - dokploy-network

  # Private to the crawler: only on the "internal" network, never on dokploy-network, so nothing
  # else can reach it — hence no password. No persistence either: the crawler rebuilds every key
  # from Postgres on start (WarmSimhashCache, WarmFrontierCache), so a restart loses nothing.
  crawler-redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

# The shared Postgres (a Dokploy Database resource) lives on the "dokploy-network" overlay
# network — a Compose project's own bridge network has no route to it, and DATABASE_URL's
# hostname fails DNS resolution outright. See PRODUCTION.md's findings.
networks:
  internal:
  dokploy-network:
    external: true
